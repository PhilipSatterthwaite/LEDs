<style>
:root{
  --g:#0A0D12; --s:#141922; --z:#1C232E; --l:#29323F;
  --t:#E6EBF2; --d:#7A8797; --r:14px;
  --live:#30D158; --warn:#FFD60A; --dead:#FF453A;
}
*{box-sizing:border-box}
html{background:var(--g)}
body{
  margin:0 auto; max-width:520px;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  background:var(--g); color:var(--t);
  font:400 16px/1.45 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}
#link{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--d);
  letter-spacing:.16em;text-transform:uppercase}
#dot{width:8px;height:8px;border-radius:50%;background:var(--warn);
  box-shadow:0 0 10px -1px var(--warn);transition:background .25s,box-shadow .25s}
#link[data-s=live] #dot{background:var(--live);box-shadow:0 0 10px -1px var(--live)}
#link[data-s=down] #dot{background:var(--dead);box-shadow:0 0 10px -1px var(--dead)}

#hint{margin:0 0 14px;padding:11px 13px;border-radius:var(--r);
  background:#2A1A1C;border:1px solid #5B2F33;color:#F0A8AE;
  font-size:13px;line-height:1.45;word-break:break-word}

/* Matches the sketch's boot state: dim red, not a full-brightness rainbow. */
#st{height:52px;border-radius:var(--r);border:1px solid var(--l);
  transition:background .18s,filter .18s;
  background:#FF0000}
.sl{display:flex;justify-content:space-between;margin:8px 2px 20px;
  font-size:11px;color:var(--d);letter-spacing:.16em;text-transform:uppercase;
  font-variant-numeric:tabular-nums}

h2{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--d);
  letter-spacing:.2em;text-transform:uppercase}

.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.sc button{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;
  padding:13px 8px 11px;border:1px solid var(--l);border-radius:var(--r);
  background:var(--s);color:var(--t);font:inherit;font-size:13px}
.sc i{display:block;width:100%;height:16px;border-radius:5px}
.sc button[aria-pressed=true]{background:var(--z);border-color:#5A6879}

.co{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:22px}
.sw{aspect-ratio:1;padding:0;border:none;border-radius:50%;background:var(--c);
  transition:box-shadow .16s;box-shadow:0 0 0 1px #0006 inset,0 5px 16px -7px var(--c)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--g),0 0 0 4px var(--t),0 0 26px -4px var(--c)}

/* HSV disc: hue around, saturation outward. Rendered entirely with gradients
   so it stays sharp on any display, with the picked value derived from the
   pointer angle and radius rather than read back from pixels. */
.wrap{position:relative;width:100%;max-width:236px;margin:0 auto 22px;aspect-ratio:1}
#wheel{position:absolute;inset:0;border-radius:50%;touch-action:none;cursor:crosshair;
  background:
    radial-gradient(circle closest-side,#fff 0%,rgba(255,255,255,0) 100%),
    conic-gradient(from 90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  box-shadow:0 0 0 1px var(--l),0 12px 34px -18px #000}
#pin{position:absolute;width:24px;height:24px;border-radius:50%;
  border:3px solid #fff;box-shadow:0 0 0 1px #0009,0 2px 8px #0007;
  transform:translate(-50%,-50%);pointer-events:none;left:50%;top:50%}

.pn{background:var(--s);border:1px solid var(--l);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px}
.pn .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--d);
  margin-bottom:9px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#7FB2FF;touch-action:none}

.lamp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  background:var(--s);border:1px solid var(--l);border-radius:var(--r);
  padding:12px 14px;margin-top:9px}
.lamp b{display:block;font-size:13px;font-weight:600}
.lamp span{display:block;font-size:11px;color:var(--d);margin-top:2px;
  letter-spacing:.04em}
.lamp button{padding:9px 15px;border:1px solid var(--l);border-radius:9px;
  background:var(--z);color:var(--t);font:inherit;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.lamp[data-on=true] button{background:#16301E;border-color:#2E6B45;color:#8FE0AC}

#pw{width:100%;padding:15px 0;border:1px solid var(--l);border-radius:var(--r);
  background:var(--s);color:var(--t);font:inherit;font-size:13px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase}
#pw[data-on=false]{background:#2A1A1C;border-color:#5B2F33;color:#F0A8AE}

button{cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid #7FB2FF;outline-offset:3px}
body[data-ready=false] .sc button,
body[data-ready=false] .sw,
body[data-ready=false] .wrap,
body[data-ready=false] .pn,
body[data-ready=false] #pw{opacity:.4;pointer-events:none}

@keyframes ping{from{opacity:1}to{opacity:0}}
#sent{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  padding:7px 16px;border-radius:99px;background:var(--z);border:1px solid var(--l);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--d);
  opacity:0;pointer-events:none}
#sent.go{animation:ping 1s ease forwards}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body data-ready="false">

<header>
  <h1>LEDs</h1>
  <span id="link" data-s="wait"><span id="dot"></span><span id="ls">Connecting</span></span>
</header>

<p id="hint" hidden>Connecting&hellip;</p>

<div id="st"></div>
<div class="sl"><span id="nw">Red</span><span id="bl">10 / 50</span></div>

<div class="pn">
  <div class="hd"><span>Brightness</span><span id="bv">10</span></div>
  <input type="range" id="sr" min="1" max="50" value="10" aria-label="Brightness">
</div>

<h2>Moving</h2>
<div class="sc">
  <button data-c="cy" data-lamp="#FFA239" aria-pressed="false"
    data-bg="linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
    <i style="background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></i>Cycle</button>

  <!-- Dims the rainbow everywhere except the pulse, rather than laying white
       over it -- the effect is a brightness change, not a colour change. -->
  <button data-c="wo" data-lamp="#FFA239" aria-pressed="false"
    data-bg="radial-gradient(circle 26px at 72% 50%,transparent,rgba(0,0,0,.38) 100%),linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
    <i style="background:radial-gradient(circle 11px at 72% 50%,transparent,rgba(0,0,0,.38) 100%),linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></i>Worm</button>

  <button data-c="w4" data-lamp="#FFA239" aria-pressed="false"
    data-bg="repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.42) 62px 120px),linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
    <i style="background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.42) 18px 34px),linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></i>4 Worms</button>
</div>

<h2>Color</h2>
<div class="co">
  <button class="sw" style="--c:#FF0000" data-c="r"  aria-label="Red"         aria-pressed="true"></button>
  <button class="sw" style="--c:#00FF00" data-c="g"  aria-label="Green"       aria-pressed="false"></button>
  <button class="sw" style="--c:#0000FF" data-c="b"  aria-label="Blue"        aria-pressed="false"></button>
  <button class="sw" style="--c:#FFFFFF" data-c="w"  aria-label="White"       aria-pressed="false"></button>
  <button class="sw" style="--c:#FFA239" data-c="wm" aria-label="Warm"        aria-pressed="false"></button>
  <button class="sw" style="--c:#FFEA00" data-c="y"  aria-label="Yellow"      aria-pressed="false"></button>
  <button class="sw" style="--c:#5F00A0" data-c="p"  aria-label="Purple"      aria-pressed="false"></button>
  <button class="sw" style="--c:#228B22" data-c="lg" aria-label="Light green" aria-pressed="false"></button>
  <button class="sw" style="--c:#00FFFF" data-c="lb" aria-label="Light blue"  aria-pressed="false"></button>
  <button class="sw" style="--c:#00BFFF" data-c="a"  aria-label="Aqua"        aria-pressed="false"></button>
  <button class="sw" style="--c:#0047AB" data-c="c"  aria-label="Cobalt"      aria-pressed="false"></button>
  <button class="sw" data-c="rb" data-lamp="#FFA239" aria-label="Rainbow" aria-pressed="false"
    style="--c:#FF3B30;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></button>
</div>

<h2>Fine colour</h2>
<div class="wrap">
  <div id="wheel" role="application" aria-label="Colour wheel"></div>
  <div id="pin"></div>
</div>

<button id="pw" data-on="true">On</button>

<div class="lamp" id="lamp" data-on="false">
  <div><b>Lamp</b><span id="lampstate">Not connected</span></div>
  <button id="lampbtn">Connect</button>
</div>

<div id="sent">Sent</div>

<script>
// ---------------------------------------------------------------------------
// Must match the sketch. MQTT_TOPIC and MAX_BRIGHTNESS in 450LED_WiFi.ino.
// ---------------------------------------------------------------------------
var ENDPOINTS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'ws://broker.hivemq.com:8000/mqtt'
];
var epIndex = 0;
var TOPIC  = 'lakeside/ps1639a/cmd';
var CLIENT = 'lakeside-ui-' + Math.random().toString(16).slice(2, 10);
var MAXB   = 50;
var BOOTB  = 10;   // matches BOOT_BRIGHTNESS in the sketch

// --- minimal MQTT 3.1.1 over WebSocket, same packets the Mega builds in C ---
function enc(s){ return new TextEncoder().encode(s); }

function remlen(n){
  var out = [];
  do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0);
  return out;
}

function connectPacket(){
  var cid = enc(CLIENT);
  var body = [0,4,77,81,84,84, 4, 2, 0,60,
              cid.length >> 8, cid.length & 255].concat(Array.from(cid));
  return new Uint8Array([0x10].concat(remlen(body.length), body));
}

function publishPacket(topic, payload){
  var t = enc(topic), p = enc(payload);
  var body = [t.length >> 8, t.length & 255].concat(Array.from(t), Array.from(p));
  return new Uint8Array([0x30].concat(remlen(body.length), body));
}

var ws, ready = false, pinger = null, retry = null;
var link = document.getElementById('link'),
    ls   = document.getElementById('ls'),
    hint = document.getElementById('hint'),
    sent = document.getElementById('sent');

function setLink(state, label, detail){
  link.dataset.s = state;
  ls.textContent = label;
  ready = (state === 'live');
  document.body.dataset.ready = ready;
  hint.hidden = ready;
  if (detail) hint.textContent = detail;
}

function connect(){
  clearTimeout(retry);
  var url = ENDPOINTS[epIndex % ENDPOINTS.length];
  setLink('wait', 'Connecting', 'Connecting to ' + url);
  console.log('[mqtt] trying', url);

  try { ws = new WebSocket(url, 'mqtt'); }
  catch (e) { console.warn('[mqtt] construct failed', e); epIndex++; return schedule(); }
  ws.binaryType = 'arraybuffer';

  ws.onopen = function(){ console.log('[mqtt] socket open'); ws.send(connectPacket()); };

  ws.onmessage = function(e){
    var b = new Uint8Array(e.data);
    if (b[0] === 0x20) {
      if (b[3] === 0) {
        console.log('[mqtt] connected via', url);
        setLink('live', 'Live');
        clearInterval(pinger);
        pinger = setInterval(function(){
          if (ws.readyState === 1) ws.send(new Uint8Array([0xC0, 0]));
        }, 30000);
      } else {
        setLink('down', 'Refused', 'Broker refused the connection (code ' + b[3] + ')');
      }
    }
  };

  ws.onclose = function(ev){
    clearInterval(pinger);
    console.warn('[mqtt] closed', ev.code, ev.reason || '');
    setLink('down', 'Offline',
      'Could not reach ' + url + ' (close ' + ev.code + '). Retrying on the other port.');
    epIndex++;
    schedule();
  };

  ws.onerror = function(){ try { ws.close(); } catch (e) {} };
}

function schedule(){ clearTimeout(retry); retry = setTimeout(connect, 3000); }

function publish(cmd, quiet){
  if (!ready || ws.readyState !== 1) return false;
  ws.send(publishPacket(TOPIC, cmd));
  if (!quiet) {
    sent.classList.remove('go');
    void sent.offsetWidth;
    sent.classList.add('go');
  }
  return true;
}

// While an animation runs the Mega is deaf for ~13ms out of every 50 -- it
// cannot service the UART with interrupts off mid-show() -- so roughly a
// quarter of single publishes land in a blackout and are lost. Sending each
// discrete press twice drops the miss rate to a few percent. Safe only because
// every command is idempotent, which is why power is on/off and not a toggle.
function sendTwice(cmd){
  if (!publish(cmd)) return false;
  setTimeout(function(){ publish(cmd, true); }, 220);
  return true;
}

// Dragging the wheel or slider fires continuously. Unthrottled that floods the
// 115200 link to the ESP, and every FastLED.show() blocks interrupts for ~13ms
// while 450 pixels clock out -- so the Mega would fall behind and stutter.
// Rate-limit to ~7/sec, and always deliver the final value on release.
var lastSend = 0, queued = null, qTimer = null;

function send(cmd){
  var now = Date.now();
  if (now - lastSend >= 140) { lastSend = now; queued = null; return publish(cmd); }
  queued = cmd;
  clearTimeout(qTimer);
  qTimer = setTimeout(flush, 140 - (now - lastSend));
  return true;
}
function flush(){
  clearTimeout(qTimer);
  if (queued === null) return;
  lastSend = Date.now();
  publish(queued);
  queued = null;
}

// --- UI -------------------------------------------------------------------
var NAMES = {r:'Red', g:'Green', b:'Blue', w:'White', wm:'Warm', y:'Yellow',
             p:'Purple', lg:'Light green', lb:'Light blue', a:'Aqua',
             c:'Cobalt', rb:'Rainbow', cy:'Cycle', wo:'Worm', w4:'4 Worms'};

var B = BOOTB, ON = true;
var strip = document.getElementById('st'),
    now   = document.getElementById('nw'),
    bv    = document.getElementById('bv'),
    bl    = document.getElementById('bl'),
    pw    = document.getElementById('pw'),
    sr    = document.getElementById('sr'),
    wheel = document.getElementById('wheel'),
    pin   = document.getElementById('pin');

function paint(){
  strip.style.filter = ON ? 'brightness(' + (0.25 + 0.75 * B / MAXB) + ')' : 'brightness(.08)';
  bv.textContent = B;
  bl.textContent = (ON ? B : 0) + ' / ' + MAXB;
  pw.textContent = ON ? 'On' : 'Off';
  pw.dataset.on  = ON;
}

function mark(el, bg, label){
  document.querySelectorAll('[aria-pressed]').forEach(function(x){
    x.setAttribute('aria-pressed', 'false');
  });
  if (el) el.setAttribute('aria-pressed', 'true');
  strip.style.background = bg;
  now.textContent = label;
}

document.body.addEventListener('click', function(e){
  var btn = e.target.closest('[data-c]');
  if (!btn) return;
  var c = btn.dataset.c;
  if (!sendTwice(c)) return;

  mark(btn, btn.dataset.bg || btn.style.getPropertyValue('--c'), NAMES[c] || c);
  ON = true;

  var hex = (btn.dataset.lamp || btn.style.getPropertyValue('--c') || '').trim();
  if (/^#[0-9a-f]{6}$/i.test(hex)) lampHex = hex;
  lampQueue(lampHex, true);

  paint();
});

// Power sends an explicit on/off rather than a toggle, so a duplicate send
// cannot flip it back.
pw.addEventListener('click', function(){
  if (!sendTwice(ON ? 'off' : 'on')) return;
  ON = !ON;
  lampQueue(lampHex, ON);
  paint();
});

// --- brightness: absolute value, floor of 1. Only the power button turns the
// --- strip fully off, so the slider bottoming out still leaves it lit.
sr.addEventListener('input', function(){
  B = +sr.value; ON = true;
  send('v' + B);
  lampQueue(lampHex, true);
  paint();
});
sr.addEventListener('change', flush);

// --- colour wheel ---------------------------------------------------------
function hsv2rgb(h, s, v){
  var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
  if      (h <  60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [r + m, g + m, b + m].map(function(n){ return Math.round(n * 255); });
}
function toHex(rgb){
  return rgb.map(function(n){ return ('0' + n.toString(16)).slice(-2); }).join('');
}

// Value is fixed at 1 here: the wheel picks hue and saturation, the slider
// owns brightness. Keeping them separate means dragging one never fights the
// other, and it maps onto FastLED's global brightness exactly.
function setHS(h, s){
  var hex = toHex(hsv2rgb(h, s, 1));
  var rad = h * Math.PI / 180;
  pin.style.left = (50 + Math.cos(rad) * s * 50) + '%';
  pin.style.top  = (50 + Math.sin(rad) * s * 50) + '%';
  pin.style.background = '#' + hex;
  mark(null, '#' + hex, '#' + hex.toUpperCase());
  ON = true;
  send('h' + hex);
  lampHex = '#' + hex;
  lampQueue(lampHex, true);
  paint();
}

function pickAt(x, y){
  var r = wheel.getBoundingClientRect();
  var rad = r.width / 2;
  var dx = x - (r.left + rad), dy = y - (r.top + r.height / 2);
  var d = Math.min(Math.hypot(dx, dy), rad);
  var h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  setHS(h, rad ? d / rad : 0);
}

var dragging = false;
wheel.addEventListener('pointerdown', function(e){
  dragging = true;
  wheel.setPointerCapture(e.pointerId);
  pickAt(e.clientX, e.clientY);
});
wheel.addEventListener('pointermove', function(e){
  if (dragging) pickAt(e.clientX, e.clientY);
});
function endDrag(){ if (dragging) { dragging = false; flush(); } }
wheel.addEventListener('pointerup', endDrag);
wheel.addEventListener('pointercancel', endDrag);

// ---------------------------------------------------------------------------
// Kasa lamp, through TP-Link's cloud.
//
// The Mega cannot do this: the cloud is HTTPS and its 2016 AT firmware has no
// usable TLS. A browser does, so the lamp is driven from here instead -- the
// same outbound-only pattern as MQTT, which is why it works across networks
// with no local reachability at all.
//
// Credentials are entered at runtime and kept in this browser's localStorage.
// They are never in the repository -- this page is served publicly.
// ---------------------------------------------------------------------------
var TPLINK  = 'https://wap.tplinkcloud.com/';
var BULB_ID = '80129AC33FC34D22F321A5A549B6731722476A36';

// TP-Link rejects logins whose client identification it does not recognise
// ("app version is too old"), and the accepted shape has changed over time.
// Rather than guess, try the known forms in order and keep whichever works --
// the console names it, so it can be pinned later if wanted.
var LOGIN_VARIANTS = [
  { url: TPLINK, appType: 'Kasa_Android', appVersion: '2.8.0' },
  { url: TPLINK, appType: 'Kasa_Android', appVersion: '1.4.4.607' },
  { url: TPLINK, appType: 'Kasa_iOS',     appVersion: '2.8.0' },
  { url: TPLINK, appType: 'Kasa_Android' },
  { url: 'https://n-wap-gw.tplinkcloud.com/', appType: 'Kasa_Android', appVersion: '2.8.0' }
];

var lamp      = document.getElementById('lamp'),
    lampState = document.getElementById('lampstate'),
    lampBtn   = document.getElementById('lampbtn');
var lampToken = null;
var lampUrl   = TPLINK;   // whichever endpoint the successful login used

function uuid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID()
       : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
           var r = Math.random() * 16 | 0;
           return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
         });
}

function lampSay(msg, on){
  lampState.textContent = msg;
  lamp.dataset.on = !!on;
  lampBtn.textContent = on ? 'On' : 'Connect';
}

// text/plain keeps this a "simple" request, so the browser skips the CORS
// preflight -- one fewer thing TP-Link's API has to cooperate with.
function tplink(url, body){
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

function tryLogin(user, pass, v){
  var params = {
    appType: v.appType,
    cloudUserName: user,
    cloudPassword: pass,
    terminalUUID: uuid()
  };
  if (v.appVersion) params.appVersion = v.appVersion;

  return tplink(v.url, { method: 'login', params: params }).then(function(j){
    if (j.error_code !== 0) {
      throw new Error((j.msg || 'rejected') + ' [' + j.error_code + ']');
    }
    return j.result.token;
  });
}

function lampLogin(user, pass){
  lampSay('Connecting…', false);

  var i = 0, lastErr = null;
  function next(){
    if (i >= LOGIN_VARIANTS.length) {
      throw lastErr || new Error('no login variant accepted');
    }
    var v = LOGIN_VARIANTS[i++];
    console.log('[tplink] trying', v.appType, v.appVersion || '(no version)', v.url);

    return tryLogin(user, pass, v).then(function(token){
      lampToken = token;
      lampUrl   = v.url;
      console.log('[tplink] accepted:', JSON.stringify(v));
      localStorage.setItem('tplink', JSON.stringify({ u: user, p: pass }));
      lampSay('Connected', true);
    }).catch(function(err){
      lastErr = err;
      console.warn('[tplink] rejected:', v.appType, v.appVersion || '', '->', err.message);
      // A bad password fails every variant identically; no point grinding
      // through the rest, and the message is clearer if we stop here.
      if (/password|username|account/i.test(err.message)) throw err;
      return next();
    });
  }
  return next();
}

function lampSend(inner){
  if (!lampToken) return;
  return tplink(lampUrl + '?token=' + encodeURIComponent(lampToken), {
    method: 'passthrough',
    params: { deviceId: BULB_ID, requestData: JSON.stringify(inner) }
  }).catch(function(){ lampSay('Send failed', false); });
}

// Colour comes in as #rrggbb; the bulb wants hue/saturation/brightness.
function rgb2hsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
  if (d) {
    if (mx === r)      h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (mx === g) h = ((b - r) / d + 2) * 60;
    else               h = ((r - g) / d + 4) * 60;
  }
  return { h: Math.round(h), s: Math.round(mx ? d / mx * 100 : 0) };
}

function lampApply(hex, on){
  if (!lampToken) return;
  if (!on) return lampSend({'smartlife.iot.smartbulb.lightingservice':
    {transition_light_state:{on_off:0, transition_period:400}}});

  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if (!m) return;
  var c = rgb2hsv(parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16));
  lampSend({'smartlife.iot.smartbulb.lightingservice': {transition_light_state:{
    ignore_default: 1, on_off: 1, hue: c.h, saturation: c.s, color_temp: 0,
    brightness: Math.max(1, Math.round(B / MAXB * 100)), transition_period: 400
  }}});
}

// Last real colour seen. Scenes are multicoloured, so they carry a data-lamp
// stand-in rather than leaving the lamp on whatever preceded them.
var lampHex = '#FF0000';
var lampTimer = null, lampPending = null;

// The cloud round trip is far slower than a slider drag, so coalesce.
function lampQueue(hex, on){
  if (!lampToken) return;
  lampPending = { hex: hex, on: on };
  if (lampTimer) return;
  lampTimer = setTimeout(function(){
    lampTimer = null;
    if (lampPending) { lampApply(lampPending.hex, lampPending.on); lampPending = null; }
  }, 600);
}

lampBtn.addEventListener('click', function(){
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('tplink') || '{}'); } catch (e) {}
  var user = prompt('TP-Link account email', saved.u || '');
  if (!user) return;
  var pass = prompt('TP-Link password', saved.p || '');
  if (!pass) return;
  lampLogin(user, pass).catch(function(err){
    lampSay(String(err.message || err).slice(0, 40), false);
    console.error('[tplink]', err);
  });
});

// Reconnect silently if credentials are already stored on this device.
(function(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('tplink') || 'null'); } catch (e) {}
  if (saved && saved.u) lampLogin(saved.u, saved.p).catch(function(err){
    lampSay('Tap to reconnect', false);
    console.error('[tplink]', err);
  });
})();

document.addEventListener('visibilitychange', function(){
  if (!document.hidden && (!ws || ws.readyState > 1)) connect();
});

paint();
connect();
