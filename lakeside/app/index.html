<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakeside</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lakeside">
<!-- Only takes effect over http(s); a file:// page cannot be installed. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0D12'/%3E%3Cg%3E%3Crect x='24' y='78' width='18' height='24' rx='5' fill='%23FF3B30'/%3E%3Crect x='52' y='78' width='18' height='24' rx='5' fill='%23FFD60A'/%3E%3Crect x='80' y='78' width='18' height='24' rx='5' fill='%2330D158'/%3E%3Crect x='108' y='78' width='18' height='24' rx='5' fill='%230A84FF'/%3E%3Crect x='136' y='78' width='18' height='24' rx='5' fill='%23BF5AF2'/%3E%3C/g%3E%3C/svg%3E">

<style>
:root{
  --g:#0A0D12; --s:#141922; --z:#1C232E; --l:#29323F;
  --t:#E6EBF2; --d:#7A8797; --r:14px;
  --live:#30D158; --warn:#FFD60A; --dead:#FF453A;
}
*{box-sizing:border-box}
html{background:var(--g)}
body{
  margin:0 auto; max-width:520px;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  background:var(--g); color:var(--t);
  font:400 16px/1.45 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}
#link{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--d);
  letter-spacing:.16em;text-transform:uppercase}
#dot{width:8px;height:8px;border-radius:50%;background:var(--warn);
  box-shadow:0 0 10px -1px var(--warn);transition:background .25s,box-shadow .25s}
#link[data-s=live] #dot{background:var(--live);box-shadow:0 0 10px -1px var(--live)}
#link[data-s=down] #dot{background:var(--dead);box-shadow:0 0 10px -1px var(--dead)}

#hint{margin:0 0 14px;padding:11px 13px;border-radius:var(--r);
  background:#2A1A1C;border:1px solid #5B2F33;color:#F0A8AE;
  font-size:13px;line-height:1.45;word-break:break-word}

#st{height:52px;border-radius:var(--r);border:1px solid var(--l);
  transition:background .18s,filter .18s;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sl{display:flex;justify-content:space-between;margin:8px 2px 20px;
  font-size:11px;color:var(--d);letter-spacing:.16em;text-transform:uppercase;
  font-variant-numeric:tabular-nums}

h2{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--d);
  letter-spacing:.2em;text-transform:uppercase}

.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.sc button{display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:13px 8px 11px;border:1px solid var(--l);border-radius:var(--r);
  background:var(--s);color:var(--t);font:inherit;font-size:13px}
.sc i{display:block;width:100%;height:16px;border-radius:5px}
.sc button[aria-pressed=true]{background:var(--z);border-color:#5A6879}

.co{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:24px}
.sw{aspect-ratio:1;padding:0;border:none;border-radius:50%;background:var(--c);
  transition:box-shadow .16s;box-shadow:0 0 0 1px #0006 inset,0 5px 16px -7px var(--c)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--g),0 0 0 4px var(--t),0 0 26px -4px var(--c)}

.ra{display:grid;grid-template-columns:1fr auto;gap:9px}
.br{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;
  background:var(--s);border:1px solid var(--l);border-radius:var(--r)}
.br button{padding:15px 0;border:none;border-radius:var(--r);background:none;
  color:var(--t);font:inherit;font-size:22px}
#bv{text-align:center;font-size:13px;color:var(--d);letter-spacing:.1em;
  font-variant-numeric:tabular-nums}
#pw{padding:0 22px;border:1px solid var(--l);border-radius:var(--r);
  background:var(--s);color:var(--t);font:inherit;font-size:13px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase}
#pw[data-on=false]{background:#2A1A1C;border-color:#5B2F33;color:#F0A8AE}

button{cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid #7FB2FF;outline-offset:3px}
body[data-ready=false] .sc button,
body[data-ready=false] .sw,
body[data-ready=false] .ra button{opacity:.4;pointer-events:none}

/* brief flash confirming a command actually went out */
@keyframes ping{from{opacity:1}to{opacity:0}}
#sent{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  padding:7px 16px;border-radius:99px;background:var(--z);border:1px solid var(--l);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--d);
  opacity:0;pointer-events:none}
#sent.go{animation:ping 1s ease forwards}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-ready="false">

<header>
  <h1>Lakeside</h1>
  <span id="link" data-s="wait"><span id="dot"></span><span id="ls">Connecting</span></span>
</header>

<p id="hint" hidden>Connecting&hellip;</p>

<div id="st"></div>
<div class="sl"><span id="nw">Rainbow</span><span id="bl">50 / 50</span></div>

<h2>Scenes</h2>
<div class="sc">
  <button data-c="rb" aria-pressed="true"
    data-bg="linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
    <i style="background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></i>Rainbow</button>
  <button data-c="wm" aria-pressed="false" data-bg="#FFA239">
    <i style="background:#FFA239"></i>Warm</button>
  <button data-c="x" aria-pressed="false"
    data-bg="repeating-linear-gradient(90deg,#fff 0 6px,#0a0d12 6px 34px)">
    <i style="background:repeating-linear-gradient(90deg,#fff 0 4px,#0a0d12 4px 20px)"></i>Crossword</button>
</div>

<h2>Color</h2>
<div class="co">
  <button class="sw" style="--c:#FF0000" data-c="r"  aria-label="Red"></button>
  <button class="sw" style="--c:#00FF00" data-c="g"  aria-label="Green"></button>
  <button class="sw" style="--c:#0000FF" data-c="b"  aria-label="Blue"></button>
  <button class="sw" style="--c:#FFFFFF" data-c="w"  aria-label="White"></button>
  <button class="sw" style="--c:#FFEA00" data-c="y"  aria-label="Yellow"></button>
  <button class="sw" style="--c:#5F00A0" data-c="p"  aria-label="Purple"></button>
  <button class="sw" style="--c:#228B22" data-c="lg" aria-label="Light green"></button>
  <button class="sw" style="--c:#00FFFF" data-c="lb" aria-label="Light blue"></button>
  <button class="sw" style="--c:#00BFFF" data-c="a"  aria-label="Aqua"></button>
  <button class="sw" style="--c:#0047AB" data-c="c"  aria-label="Cobalt"></button>
</div>

<div class="ra">
  <div class="br">
    <button data-c="dn" aria-label="Dimmer">&minus;</button>
    <span id="bv">Brightness 50</span>
    <button data-c="up" aria-label="Brighter">+</button>
  </div>
  <button id="pw" data-c="off" data-on="true">On</button>
</div>

<div id="sent">Sent</div>

<script>
// ---------------------------------------------------------------------------
// Must match the sketch. MQTT_TOPIC in 450LED_WiFi.ino.
// ---------------------------------------------------------------------------
// Tried in order, cycling on failure. 8884 is the TLS WebSocket port and some
// networks block it; 8000 is plaintext and only usable from a file:// or
// http:// page, since an https:// page refuses mixed content.
var ENDPOINTS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'ws://broker.hivemq.com:8000/mqtt'
];
var epIndex = 0;
var TOPIC  = 'lakeside/ps1639a/cmd';
// Deliberately NOT the sketch's client id -- a broker disconnects the older
// connection when two clients claim the same one, and the two would take turns
// kicking each other off forever.
var CLIENT = 'lakeside-ui-' + Math.random().toString(16).slice(2, 10);

// --- minimal MQTT 3.1.1 over WebSocket. No library, same packets the Mega
// --- builds in C, so there is one protocol implementation to reason about.
function enc(s){ return new TextEncoder().encode(s); }

function remlen(n){                       // variable-length integer
  var out = [];
  do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0);
  return out;
}

function connectPacket(){
  var cid = enc(CLIENT);
  var body = [0,4,77,81,84,84, 4, 2, 0,60,          // "MQTT", level 4, clean, keepalive 60
              cid.length >> 8, cid.length & 255].concat(Array.from(cid));
  return new Uint8Array([0x10].concat(remlen(body.length), body));
}

function publishPacket(topic, payload){
  var t = enc(topic), p = enc(payload);
  var body = [t.length >> 8, t.length & 255]
             .concat(Array.from(t), Array.from(p));
  return new Uint8Array([0x30].concat(remlen(body.length), body));   // QoS 0
}

var ws, ready = false, pinger = null, retry = null;
var link = document.getElementById('link'),
    ls   = document.getElementById('ls'),
    sent = document.getElementById('sent');

var hint = document.getElementById('hint');

function setLink(state, label, detail){
  link.dataset.s = state;
  ls.textContent = label;
  ready = (state === 'live');
  document.body.dataset.ready = ready;
  hint.hidden = ready;
  if (detail) hint.textContent = detail;
}

function connect(){
  clearTimeout(retry);
  var url = ENDPOINTS[epIndex % ENDPOINTS.length];
  setLink('wait', 'Connecting', 'Connecting to ' + url);
  console.log('[mqtt] trying', url);

  try { ws = new WebSocket(url, 'mqtt'); }
  catch (e) { console.warn('[mqtt] construct failed', e); epIndex++; return schedule(); }
  ws.binaryType = 'arraybuffer';

  ws.onopen = function(){ console.log('[mqtt] socket open'); ws.send(connectPacket()); };

  ws.onmessage = function(e){
    var b = new Uint8Array(e.data);
    if (b[0] === 0x20) {                              // CONNACK
      if (b[3] === 0) {
        console.log('[mqtt] connected via', url);
        setLink('live', 'Live');
        clearInterval(pinger);
        pinger = setInterval(function(){
          if (ws.readyState === 1) ws.send(new Uint8Array([0xC0, 0]));
        }, 30000);
      } else {
        setLink('down', 'Refused', 'Broker refused the connection (code ' + b[3] + ')');
      }
    }
  };

  ws.onclose = function(ev){
    clearInterval(pinger);
    console.warn('[mqtt] closed', ev.code, ev.reason || '');
    setLink('down', 'Offline',
      'Could not reach ' + url + ' (close ' + ev.code + '). Retrying on the other port.');
    epIndex++;
    schedule();
  };

  ws.onerror = function(){ try { ws.close(); } catch (e) {} };
}

function schedule(){ clearTimeout(retry); retry = setTimeout(connect, 3000); }

function publish(cmd){
  if (!ready || ws.readyState !== 1) return false;
  ws.send(publishPacket(TOPIC, cmd));
  sent.classList.remove('go');
  void sent.offsetWidth;                              // restart the animation
  sent.classList.add('go');
  return true;
}

// --- UI -------------------------------------------------------------------
var NAMES = {r:'Red', g:'Green', b:'Blue', w:'White', y:'Yellow', p:'Purple',
             lg:'Light green', lb:'Light blue', a:'Aqua', c:'Cobalt',
             rb:'Rainbow', wm:'Warm', x:'Crossword'};

var B = 50, ON = true;
var strip = document.getElementById('st'),
    now   = document.getElementById('nw'),
    bv    = document.getElementById('bv'),
    bl    = document.getElementById('bl'),
    pw    = document.getElementById('pw');

function paint(){
  strip.style.filter = ON ? 'brightness(' + (0.25 + 0.75 * B / 50) + ')' : 'brightness(.08)';
  bv.textContent = ON ? 'Brightness ' + B : 'Off';
  bl.textContent = (ON ? B : 0) + ' / 50';
  pw.textContent = ON ? 'On' : 'Off';
  pw.dataset.on  = ON;
}

document.body.addEventListener('click', function(e){
  var btn = e.target.closest('[data-c]');
  if (!btn) return;
  var c = btn.dataset.c;
  if (!publish(c)) return;                            // don't fake state when offline

  if (c === 'up')       { B = Math.min(B + 10, 50); ON = true; }
  else if (c === 'dn')  { B = Math.max(B - 10, 0); }
  else if (c === 'off') { ON = !ON; }
  else {
    document.querySelectorAll('[aria-pressed]').forEach(function(x){
      x.setAttribute('aria-pressed', 'false');
    });
    btn.setAttribute('aria-pressed', 'true');
    strip.style.background = btn.dataset.bg || btn.style.getPropertyValue('--c');
    now.textContent = NAMES[c] || c;
    ON = true;
  }
  paint();
});

// Phones suspend sockets in the background; reconnect on return rather than
// leaving a dead link that looks live.
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && (!ws || ws.readyState > 1)) connect();
});

paint();
connect();
</script>
</body>
</html>
